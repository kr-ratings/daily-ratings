name: 금리 빠른 갱신

# 장 마감(15:30) 후 금융투자협회 최종호가가 고시되면 바로 반영하려고, 평일 15:50~17:50(KST)
# 30분 간격으로 금리만 다시 받는다. 바뀐 게 없으면 커밋·배포하지 않는다. 1분 안팎이면 끝난다.
on:
  schedule:
    # UTC 기준. 06:50 = 15:50 KST, 07:20~08:50 = 16:20~17:50 KST
    - cron: "50 6 * * 1-5"
    - cron: "20,50 7-8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ratings-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 금리 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python -m collector.rates_job

      - name: 커밋
        id: commit
        run: |
          git config user.name "daily-ratings-bot"
          git config user.email "daily-ratings-bot@users.noreply.github.com"
          git add site/data/rates.json site/data/status.json
          if git diff --cached --quiet; then
            echo "변경 없음"; echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "rates: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == '1'
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == '1'
        continue-on-error: true
        with:
          path: site
      - id: deploy
        if: steps.commit.outputs.changed == '1'
        uses: actions/deploy-pages@v4
        continue-on-error: true
